spring:
  application:
    name: tupi-digital-api

  datasource:
    url: jdbc:postgresql://localhost:5433/tupi_digital
    username: tupidigital
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # As requested, we use flyway, so we only validate JPA mapping
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dHVwaWRpZ2l0YWwtc2VjcmV0LWtleS1leGFtcGxlLWhhcmRjb2RlZC1mb3ItZGV2ZWxvcG1lbnQ=}
  expiration: 86400000 # 24 hours in milliseconds
